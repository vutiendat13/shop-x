<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sửa sản phẩm - Admin</title>
<link rel="stylesheet" href="/static/css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/" class="logo" style="display:flex;align-items:baseline;gap:2px;padding:20px;border-bottom:1px solid rgba(255,255,255,.1);">
      <span class="logo-text">Shop</span><span class="logo-x">x</span><span class="logo-sub" style="color:#67e8f9;border-color:rgba(103,232,249,.3);">Admin</span>
    </a>
    <nav class="admin-nav">
      <a href="/admin">📊 Dashboard</a>
      <a href="/admin/products" class="active">📦 Sản phẩm</a>
      <a href="/admin/inventory">📋 Tồn kho</a>
      <a href="/admin/orders">🛒 Đơn hàng</a>
      <a href="/admin/flash-sales">⚡ Flash Sale</a>
      <a href="/admin/notifications">🔔 Thông báo</a>
      <a href="/">🏠 Về trang chủ</a>
      <a href="/logout">🚪 Đăng xuất</a>
    </nav>
  </aside>
  <div class="admin-content">
    <div class="admin-topbar">
      <h1 style="font-size:20px;font-weight:700;">✏️ Sửa sản phẩm #{{ product.id }}</h1>
      <a href="/admin/products" class="btn btn-outline">← Quay lại</a>
    </div>
    <div class="admin-body">
      <div class="admin-card" style="max-width:680px;">
        <div style="display:flex;gap:20px;padding:20px;border-bottom:1px solid var(--border);align-items:center;">
          <img src="{{ product.image }}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;" onerror="this.src='https://picsum.photos/100/100?random={{ product.id }}'">
          <div>
            <h2 style="font-size:18px;font-weight:700;">{{ product.name }}</h2>
            <p style="font-size:13px;color:var(--text-light);margin-top:4px;">ID: {{ product.id }} | Đã bán: {{ product.sold }}</p>
          </div>
        </div>
        <div style="padding:24px;">
          <form method="POST">
            <div class="form-group">
              <label>Tên sản phẩm</label>
              <input type="text" name="name" value="{{ product.name }}" required>
            </div>
            <div class="form-group">
              <label>Mô tả</label>
              <textarea name="description" rows="3" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;">{{ product.description or '' }}</textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Giá gốc (đ)</label>
                <input type="number" name="price" value="{{ product.price }}" required min="0">
              </div>
              <div class="form-group">
                <label>Giá sale (đ)</label>
                <input type="number" name="sale_price" value="{{ product.sale_price or '' }}" min="0">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Tồn kho</label>
                <input type="number" name="stock" value="{{ product.stock }}" required min="0">
              </div>
              <div class="form-group">
                <label>Danh mục</label>
                <select name="category_id" required>
                  {% for c in categories %}
                  <option value="{{ c.id }}" {{ 'selected' if c.id == product.category_id }}>{{ c.icon }} {{ c.name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>URL ảnh</label>
              <input type="text" name="image_url" value="{{ product.image or '' }}" placeholder="https://...">
            </div>
            <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px;">
              <a href="/admin/products" class="btn btn-outline">Hủy</a>
              <button type="submit" class="btn btn-primary">💾 Lưu thay đổi</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
