<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký - Shopx</title>
<link rel="stylesheet" href="/static/css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page">
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-container">
{% for category, message in messages %}
<div class="flash flash-{{ category }}">{{ message }}</div>
{% endfor %}
</div>
{% endif %}
{% endwith %}
  <div class="auth-box">
    <div class="auth-logo"><span class="logo-text">Shop</span><span class="logo-x">x</span></div>
    <div style="display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--border);">
      <a href="/login" style="flex:1;text-align:center;padding:10px;color:var(--text-light);">Đăng nhập</a>
      <div style="flex:1;text-align:center;padding:10px;font-weight:700;color:var(--primary);border-bottom:2px solid var(--primary);margin-bottom:-2px;">Đăng ký</div>
    </div>
    <form method="POST">
      <div class="form-group">
        <label>Họ tên</label>
        <input type="text" name="name" required placeholder="Nguyễn Văn A">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" name="password" required placeholder="Tối thiểu 6 ký tự" minlength="6">
      </div>
      <div class="form-group">
        <label>Câu hỏi bảo mật</label>
        <select name="security_question">
          <option>Tên thú cưng đầu tiên của bạn?</option>
          <option>Tên trường tiểu học của bạn?</option>
          <option>Quê quán của bạn?</option>
          <option>Tên người thân yêu nhất?</option>
        </select>
      </div>
      <div class="form-group">
        <label>Câu trả lời bảo mật</label>
        <input type="text" name="security_answer" required placeholder="Câu trả lời của bạn">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Đăng ký</button>
    </form>
  </div>
</div>
<script>
setTimeout(() => document.querySelectorAll('.flash').forEach(el => el.remove()), 4000);
</script>
</body>
</html>
