<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - Shopx</title>
<link rel="stylesheet" href="/static/css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page">
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-container">
{% for category, message in messages %}
<div class="flash flash-{{ category }}">{{ message }}</div>
{% endfor %}
</div>
{% endif %}
{% endwith %}
  <div class="auth-box">
    <div class="auth-logo"><span class="logo-text">Shop</span><span class="logo-x">x</span></div>
    <div style="display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--border);">
      <div style="flex:1;text-align:center;padding:10px;font-weight:700;color:var(--primary);border-bottom:2px solid var(--primary);margin-bottom:-2px;">Đăng nhập</div>
      <a href="/register" style="flex:1;text-align:center;padding:10px;color:var(--text-light);">Đăng ký</a>
    </div>
    <form method="POST">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="nhập email của bạn">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" name="password" required placeholder="nhập mật khẩu">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Đăng nhập</button>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:13px;">
      <a href="/forgot-password" style="color:var(--primary);">Quên mật khẩu?</a>
    </div>
    <div style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-light);">
      Demo: demo@shopx.vn / demo123<br>
      Admin: admin@shopx.vn / admin123
    </div>
  </div>
</div>
<script>
setTimeout(() => document.querySelectorAll('.flash').forEach(el => el.remove()), 4000);
</script>
</body>
</html>
